name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Install the CPU-only PyTorch build first. The default Linux build
      # includes CUDA libraries (several GB) that the tests don't need.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      # The embedding model is mocked in tests, so nothing is downloaded here.
      - name: Run tests
        run: pytest -q
